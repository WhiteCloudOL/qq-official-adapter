[project]
name = "qq-official-adapter"
version = "1.1.3"
description = "MaiBot adapter for the official QQ Bot API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.8.0",
    "maibot-plugin-sdk>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
include = ["*.py", "core/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["B", "E", "F"]
ignore = ["E501"]
